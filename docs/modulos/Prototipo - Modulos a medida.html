<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body><title>ROMA · Módulos a medida</title>
<style>
/* Layout: réplica del panel ROMA existente (menú lateral grafito + barra superior + contenido). Tema claro único, igual que el sistema real. */
:root{
  --orange:#f28c28; --orange-deep:#d87413; --orange-soft:#fff1df;
  --graphite:#23201d; --stone:#6f6760; --sand:#f6f2eb; --paper:#fffdfa;
  --ink:#181512; --line:#eadfd1; --line-2:#efe5d9; --head:#f7f1e8; --head-ink:#7b6f63;
  --ok:#2f7d4f; --ok-bg:#e7f4ec; --warn:#a16807; --warn-bg:#fff5df; --bad:#96382b; --bad-bg:#fde9e5;
  --font:"Aptos","Segoe UI",Roboto,Arial,sans-serif;
  --mono:"Cascadia Mono",Consolas,"SFMono-Regular",Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--font);color:var(--ink);font-size:14px;
  background:radial-gradient(circle at 14% 0%,rgba(242,140,40,.16),transparent 30%),radial-gradient(circle at 100% 10%,rgba(62,57,52,.10),transparent 28%),linear-gradient(135deg,#fbf8f4 0%,#f3ede4 48%,#fbf8f4 100%);background-color:var(--sand);background-attachment:fixed}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:flex;min-height:100%}
/* sidebar */
.side{width:260px;flex-shrink:0;background:linear-gradient(180deg,#3c342d 0%,#201c19 58%,#111 100%);color:#fff;position:sticky;top:0;height:100vh;overflow:auto;box-shadow:18px 0 50px rgba(17,17,17,.24)}
.side .brand{padding:20px 18px}
.side .brand small{display:block;color:rgba(255,255,255,.58);font-weight:900;letter-spacing:1.2px;font-size:11px;text-transform:uppercase}
.side .brand b{font-size:20px;font-weight:900}
.nav{list-style:none;margin:0;padding:6px 10px}
.nav button{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:12px;width:100%;min-height:44px;padding:0 14px;border-radius:8px;margin-bottom:6px;color:rgba(255,255,255,.78);cursor:pointer;font-weight:700}
.nav button:hover{background:rgba(242,140,40,.18);color:#fff}
.nav button.sel{background:linear-gradient(135deg,rgba(242,140,40,.28) 0%,rgba(255,255,255,.08) 100%);box-shadow:inset 3px 0 0 #f6aa57,0 12px 28px rgba(0,0,0,.22);color:#fff}
.nav button:focus-visible{outline:2px solid #f6aa57}
.nav .sub button{margin-left:10px;width:calc(100% - 10px);min-height:40px;font-size:13.5px;background:rgba(255,255,255,.04)}
.nav .sub button.sel{background:linear-gradient(135deg,rgba(242,140,40,.28) 0%,rgba(255,255,255,.08) 100%)}
.nav .muted{opacity:.45;cursor:default;pointer-events:none}
.nav svg{width:20px;height:20px;flex-shrink:0;fill:currentColor}
.nav .grp{font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:rgba(255,255,255,.45);font-weight:900;padding:12px 14px 6px}
.newtag{margin-left:auto;font-size:10px;font-weight:900;letter-spacing:.6px;background:var(--orange);color:#fff;padding:2px 7px;border-radius:99px}
/* main */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;min-height:68px;padding:0 28px;background:rgba(255,250,244,.92);backdrop-filter:blur(18px);border-bottom:1px solid rgba(228,216,202,.85);box-shadow:0 18px 40px rgba(45,35,24,.08)}
.top .t small{display:block;color:var(--stone);font-weight:900;letter-spacing:1.2px;font-size:11px;text-transform:uppercase}
.top .t b{font-size:19px;font-weight:900}
.top .sp{flex:1}
.proto{font-size:12px;font-weight:800;color:var(--orange-deep);background:var(--orange-soft);border:1px dashed #f2c27d;padding:5px 10px;border-radius:99px;white-space:nowrap}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:900;background:linear-gradient(135deg,#f6a145,#2b2723)}
.content{padding:28px;display:flex;flex-direction:column;gap:20px;min-width:0}
h1{font-size:26px;font-weight:900;margin:0;text-wrap:balance}
h2{font-size:18px;font-weight:800;margin:0}
h3{font-size:15px;font-weight:800;margin:0}
.sub-t{color:var(--stone);margin:4px 0 0;max-width:70ch;line-height:1.45}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.card{background:var(--paper);border:1px solid rgba(228,216,202,.95);border-radius:10px;box-shadow:0 20px 50px rgba(45,35,24,.07)}
.pad{padding:20px}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 18px;border-radius:8px;border:1px solid rgba(242,140,40,.28);background:var(--paper);color:var(--orange-deep);font-weight:800;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--orange);background:rgba(242,140,40,.06)}
.btn.pri{border:0;color:#fff;background:linear-gradient(135deg,#f28c28 0%,#cf6d14 58%,#2f2a25 100%);box-shadow:0 14px 32px rgba(198,106,18,.24)}
.btn.pri:hover{box-shadow:0 16px 38px rgba(123,66,14,.3)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--stone)}
.btn.sm{min-height:32px;padding:0 12px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.chipbtn:focus-visible,.side-t:focus-visible{outline:3px solid rgba(242,140,40,.45);outline-offset:2px}
.btn svg{width:18px;height:18px;fill:currentColor}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:800;color:var(--stone)}
.inp{min-height:38px;padding:0 11px;border-radius:8px;border:1px solid rgba(142,129,116,.28);background:var(--paper);font-size:14px;font-weight:600;color:var(--ink);min-width:0;width:100%}
textarea.inp{padding:9px 11px;min-height:70px;resize:vertical}
.inp:hover{border-color:rgba(242,140,40,.46)}
.inp:focus{outline:0;border-color:var(--orange);box-shadow:0 0 0 3px rgba(242,140,40,.14)}
.inp.mono{font-family:var(--mono);font-size:13px}
.inp.err{border-color:#cb5b4a;background:#fff7f5}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.tblwrap{overflow-x:auto;border-radius:10px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th{background:var(--head);color:var(--head-ink);font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;text-align:left;padding:10px 12px;font-weight:800;white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
tr.click{cursor:pointer}tr.click:hover td{background:rgba(242,140,40,.05)}
td.num,th.num{text-align:right;white-space:nowrap}
.mono{font-family:var(--mono)}
.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:99px;font-size:12.5px;font-weight:800;border:1px solid;white-space:nowrap}
.st-PENDIENTE{color:#8e5a12;background:linear-gradient(135deg,#fff6e8,#f7d19a);border-color:#f2c27d}
.st-EN_PROCESO{color:#4d453e;background:linear-gradient(135deg,#f5efe8,#d9cec1);border-color:#c8b8a6}
.st-TERMINADA{color:#8b4d0a;background:linear-gradient(135deg,#fff4e6,#f4bb72);border-color:#f0b56b}
.st-ENTREGADA{color:#231f1b;background:linear-gradient(135deg,#f2ede7,#d0c5b8);border-color:#b8ada1}
.due-ok{color:var(--ok);background:var(--ok-bg);border-color:#b7dcc5}
.due-warn{color:var(--warn);background:var(--warn-bg);border-color:#f2d08a}
.due-bad{color:var(--bad);background:var(--bad-bg);border-color:#efb1a6}
.due-done{color:var(--stone);background:#f1ece6;border-color:#ddd2c5}
.tag{font-size:11px;font-weight:900;letter-spacing:.5px;text-transform:uppercase;padding:3px 8px;border-radius:6px;background:#f1ece6;color:var(--stone)}
.tag.o{background:var(--orange-soft);color:var(--orange-deep)}
.tag.opc{background:#eef0ff;color:#464e9e}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.kpi{padding:16px 18px}
.kpi small{color:var(--stone);font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.5px}
.kpi b{display:block;font-size:26px;font-weight:900;margin-top:4px;font-variant-numeric:tabular-nums}
/* stepper */
.steps{display:flex;gap:8px;flex-wrap:wrap}
.stp{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--paper);font-weight:800;color:var(--stone);flex:1;min-width:150px;cursor:pointer}
.stp i{font-style:normal;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:#f1ece6;font-size:13px}
.stp.on{border-color:var(--orange);color:var(--ink);box-shadow:0 0 0 3px rgba(242,140,40,.12)}
.stp.on i{background:var(--orange);color:#fff}
.stp.done i{background:var(--graphite);color:#fff}
/* catalog grid */
.filters{display:flex;gap:8px;flex-wrap:wrap}
.chipbtn{height:34px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--paper);font-weight:800;color:var(--stone);cursor:pointer}
.chipbtn.on{background:var(--graphite);color:#fff;border-color:var(--graphite)}
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.mod{position:relative;display:flex;flex-direction:column;overflow:hidden;cursor:pointer;transition:box-shadow .15s,border-color .15s}
.mod:hover{border-color:#f2c27d}
.mod.on{border-color:var(--orange);box-shadow:0 0 0 3px rgba(242,140,40,.18),0 20px 50px rgba(45,35,24,.1)}
.mod .ph{aspect-ratio:4/3;background:#fff;display:grid;place-items:center;border-bottom:1px solid var(--line-2);overflow:hidden}
.mod .ph img{width:100%;height:100%;object-fit:contain}
.mod .ph.none{background:repeating-linear-gradient(135deg,#faf6f0 0 10px,#f4ede4 10px 20px);color:var(--head-ink);font-weight:800;font-size:12px;text-align:center;padding:10px}
.mod .bd{padding:12px 14px;display:flex;flex-direction:column;gap:8px;flex:1}
.mod .nm{font-weight:800;line-height:1.25}
.mod .meta{color:var(--stone);font-size:12.5px}
.mod .ck{position:absolute;top:10px;left:10px;width:26px;height:26px;border-radius:7px;border:2px solid #d6c8b8;background:#fff;display:grid;place-items:center}
.mod.on .ck{background:var(--orange);border-color:var(--orange)}
.mod.on .ck::after{content:"";width:9px;height:14px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden;width:max-content}
.qty button{all:unset;width:32px;height:32px;display:grid;place-items:center;cursor:pointer;font-weight:900;color:var(--orange-deep)}
.qty button:hover{background:var(--orange-soft)}
.qty span{min-width:30px;text-align:center;font-weight:900}
.warnbox{border:1px solid #f2d08a;background:var(--warn-bg);color:#6d4a07;border-radius:8px;padding:10px 12px;font-size:13px;line-height:1.45}
.infobox{border:1px solid var(--line);background:#fbf7f1;border-radius:8px;padding:10px 12px;font-size:13px;line-height:1.45;color:#4d453e}
/* line config */
.line{display:grid;grid-template-columns:150px minmax(0,1fr);gap:18px;padding:18px}
.line .th{border-radius:8px;border:1px solid var(--line-2);overflow:hidden;background:#fff;aspect-ratio:1/1;display:grid;place-items:center}
.line .th img{width:100%;height:100%;object-fit:contain}
.sw{display:inline-block;width:14px;height:14px;border-radius:4px;border:1px solid rgba(0,0,0,.15);vertical-align:-2px;margin-right:6px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{all:unset;padding:0 12px;height:36px;display:flex;align-items:center;font-weight:800;font-size:13px;cursor:pointer;color:var(--stone)}
.seg button.on{background:var(--graphite);color:#fff}
/* cantos toggles */
.cx{display:inline-flex;gap:4px}
.cx button{all:unset;cursor:pointer;min-width:34px;height:26px;border-radius:6px;border:1px dashed #d6c8b8;font-size:11px;font-weight:900;display:grid;place-items:center;color:#b3a594;padding:0 4px}
.cx button.on{border:1px solid var(--graphite);background:var(--graphite);color:#fff}
.cx button.on.t2{background:var(--orange-deep);border-color:var(--orange-deep)}
.cx button.edited{box-shadow:0 0 0 2px #7c8cff}
.piece-svg{display:block}
/* summary aside */
.two{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:20px;align-items:start}
.sticky{position:sticky;top:88px;display:flex;flex-direction:column;gap:14px}
.sumrow{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-variant-numeric:tabular-nums}
.sumrow:last-child{border-bottom:0}
.sumrow.tot{font-weight:900;font-size:16px;border-top:2px solid var(--graphite);border-bottom:0;margin-top:6px;padding-top:10px}
/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{all:unset;padding:12px 16px;font-weight:800;color:var(--stone);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--ink);border-bottom-color:var(--orange)}
.tabs button:focus-visible{outline:2px solid var(--orange)}
/* status track */
.track{display:flex;gap:0;align-items:center;flex-wrap:wrap}
.track .s{display:flex;align-items:center;gap:8px;font-weight:800;color:#b3a594;padding:6px 0}
.track .s i{width:24px;height:24px;border-radius:50%;border:2px solid #d6c8b8;display:grid;place-items:center;font-style:normal;font-size:12px}
.track .s.done{color:var(--ink)}.track .s.done i{background:var(--graphite);border-color:var(--graphite);color:#fff}
.track .s.cur{color:var(--orange-deep)}.track .s.cur i{background:var(--orange);border-color:var(--orange);color:#fff}
.track .bar{width:44px;height:2px;background:#e3d8ca;margin:0 10px}
/* taller pages */
.pages{display:flex;flex-direction:column;gap:24px;align-items:center;background:#e9e2d8;padding:24px 12px;border-radius:10px}
.a4{width:min(794px,100%);background:#fff;color:#111;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:34px 38px;display:flex;flex-direction:column;gap:16px;font-size:12.5px;aspect-ratio:210/297;overflow:hidden}
.a4 .hd{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid #111;padding-bottom:10px;gap:10px}
.a4 .hd img{height:38px}
.a4 .hd .r{text-align:right;font-size:11.5px;line-height:1.5}
.a4 .hd b.big{font-size:18px}
.a4 .top2{display:grid;grid-template-columns:170px minmax(0,1fr);gap:18px}
.a4 .top2 .pic{border:1px solid #ddd;aspect-ratio:1;display:grid;place-items:center}
.a4 .top2 .pic img{width:100%;height:100%;object-fit:contain}
.a4 dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0}
.a4 dt{font-weight:800;color:#555}.a4 dd{margin:0;font-weight:700}
.a4 table th{background:#eee;color:#333;font-size:10px;padding:5px 7px}
.a4 table td{padding:4px 7px;font-size:11.5px;border-bottom:1px solid #e3e3e3}
.a4 .box{width:13px;height:13px;border:1.5px solid #333;display:inline-block;border-radius:2px}
.a4 .foot{margin-top:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:16px;font-size:11px;color:#444}
.a4 .foot div{border-top:1px solid #333;padding-top:4px}
.a4 h4{margin:0;font-size:12px;text-transform:uppercase;letter-spacing:.6px}
.toast{position:fixed;right:24px;top:84px;z-index:50;background:linear-gradient(135deg,#f28c28 0%,#cf6d14 60%,#302923 100%);color:#fff;font-weight:800;padding:12px 18px;border-radius:8px;box-shadow:0 18px 42px rgba(161,87,18,.28);max-width:360px}
.empty{padding:40px;text-align:center;color:var(--stone)}
.fx-ok{color:var(--ok);font-weight:800}.fx-err{color:var(--bad);font-weight:800;font-size:12px;white-space:normal;display:inline-block;max-width:180px;text-align:right;font-family:var(--font)}
.hint{font-size:12px;color:var(--stone);line-height:1.45}
.mtabs{display:none}
.cline{display:flex;align-items:center;gap:8px;margin:2px 0;white-space:nowrap}
.etbl{min-width:1000px}
.etbl td,.etbl th{border-right:1px solid var(--line)}
.etbl td:last-child,.etbl th:last-child{border-right:0}
.etbl .inp{min-height:34px}
.etbl tr.grp td{background:#fbf5ec;font-weight:800;border-top:2px solid var(--line)}
.etbl tr.chg td:first-child{box-shadow:inset 3px 0 0 #7c8cff}
.barhead{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 16px;background:var(--orange);color:#fff;border-radius:10px 10px 0 0;font-weight:900}
.barhead span{font-weight:700;font-size:13px}
input[type=checkbox].ck2{width:18px;height:18px;accent-color:var(--orange-deep);cursor:pointer}
input[type=checkbox].ck2:disabled{cursor:not-allowed;opacity:.35}
.sw2{position:relative;display:inline-block;width:38px;height:22px}
.sw2 input{opacity:0;width:0;height:0}
.sw2 span{position:absolute;inset:0;background:#d9cec1;border-radius:99px;cursor:pointer;transition:.15s}
.sw2 span::after{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s}
.sw2 input:checked+span{background:var(--orange)}
.sw2 input:checked+span::after{transform:translateX(16px)}
.sw2 input:focus-visible+span{outline:3px solid rgba(242,140,40,.45)}
.icb{all:unset;cursor:pointer;width:32px;height:32px;display:grid;place-items:center;border-radius:50%;color:var(--stone)}
.icb:hover{background:rgba(242,140,40,.1);color:var(--orange-deep)}
.icb:disabled{opacity:.3;cursor:not-allowed}
.icb svg{width:18px;height:18px;fill:currentColor}
.icb:focus-visible{outline:3px solid rgba(242,140,40,.45)}
.dimp{display:flex;gap:10px;align-items:flex-start;margin-top:6px}
.dimp small{display:block;color:var(--stone);font-size:11px}
.dimp b{font-size:13px}
.dimp i{display:block;width:28px;height:3px;border-radius:9px;background:#17203a;margin-top:3px}
.errbox{border:1px solid #efb1a6;background:var(--bad-bg);color:var(--bad);border-radius:8px;padding:10px 12px;font-weight:700}
@media (max-width:1100px){.two{grid-template-columns:1fr}.sticky{position:static}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){
  .side{display:none}.mtabs{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;background:#23201d}
  .mtabs button{all:unset;color:rgba(255,255,255,.8);font-weight:800;font-size:13px;padding:8px 12px;border-radius:8px;white-space:nowrap;cursor:pointer}
  .mtabs button.sel{background:rgba(242,140,40,.3);color:#fff}
  .content{padding:18px 16px}.top{padding:0 16px}.proto{display:none}
  .g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .line{grid-template-columns:1fr}.line .th{max-width:160px}
  .a4{aspect-ratio:auto;padding:20px}.a4 .top2{grid-template-columns:1fr}
}
@media (max-width:520px){.g2,.g3,.g4{grid-template-columns:1fr}.stp{min-width:120px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <aside class="side" id="side"></aside>
  <div class="main">
    <div class="mtabs" id="mtabs"></div>
    <header class="top">
      <div class="t"><small>ROMA</small><b id="topTitle">Panel de solicitudes</b></div>
      <div class="sp"></div>
      <span class="proto">Prototipo · datos de ejemplo</span>
      <div class="avatar" aria-hidden="true">A</div>
    </header>
    <main class="content" id="view"></main>
  </div>
</div>

function makeEval(mod, vals){
  const pcs={}; mod.pieces.forEach(p=>pcs[p.code]=p);
  const cache={}, pcache={}, stack=new Set();
  const F=s=>String(s).replace(/×/g,'*').replace(/\b([A-Z][A-Z0-9_]*)\.(largo|ancho|cant)\b/g,(m,c,f)=>`_v("${c}","${f}")`).replace(/(^|[^"A-Za-z0-9_])([A-Z][A-Z0-9_]*)\b(?!")/g,(m,pre,k)=>`${pre}_p("${k}")`);
  function run(expr,label){ if(stack.has(label)) throw new Error('Referencia circular'); stack.add(label);
    try{ let fn; try{ fn=Function('_v','_p','return ('+F(expr)+')') }catch(e){ throw new Error('Fórmula incompleta o mal escrita') }
      const r=fn(_v,_p); if(typeof r!=='number'||!isFinite(r)) throw new Error('El resultado no es un número'); return r;} finally{stack.delete(label)} }
  function _p(k){ if(k in pcache) return pcache[k]; const par=mod.params.find(x=>x.key===k); if(!par) throw new Error('No existe la medida '+k);
    const v=par.formula? run(par.formula,k) : Number(vals[k]??par.default); pcache[k]=v; return v;}
  function _v(c,f){ const key=c+'.'+f; if(key in cache) return cache[key]; const p=pcs[c]; if(!p) throw new Error('No existe la pieza '+c);
    let v; try{ v=run(f==='largo'?p.L:f==='ancho'?p.A:p.Q,key) }catch(e){ if(e.dep) throw e; const x=new Error('Depende de '+c+', que tiene un error'); x.dep=true; throw x }
    cache[key]=v; return v;}
  function field(p,f,expr){ const key=p.code+'.'+f; if(key in cache) return cache[key]; const v=run(expr,key); cache[key]=v; return v; }
  return {piece:(p)=>({L:field(p,'largo',p.L),A:field(p,'ancho',p.A),Q:field(p,'cant',p.Q)}), param:_p};
}

function linePieces(line, overrides){
  const m=byId(line.modId); const ev=makeEval(m,line.vals); const perf=m.perfiles[line.perfil]; const out=[];
  m.pieces.forEach(p=>{
    let r; try{ r=ev.piece(p) }catch(e){ return }
    if(!r.Q) return;
    const mat = p.role==='FONDO' ? FONDO.n : col(p.role==='FRENTE'?line.colF:line.colE).n+' 18 mm';
    const key=line.uid+'|'+p.code; const base=(line.perfil===0?p.cA:p.cB);
    const sides = overrides && overrides[key] ? overrides[key] : base;
    const th = p.role==='FRENTE'?perf.fr:perf.es;
    out.push({key,id:key,code:p.code,name:p.name,role:p.role,mat,L:Math.round(r.L),A:Math.round(r.A),Q:Math.round(r.Q),sides,th,rot:false,edited:!!(overrides&&overrides[key]),
      cantos: sides.some(Boolean)?[{n:col(line.colC).n+' '+(th===2?'2 mm':'0,45 mm'),sides:sides.slice()}]:[]});
  });
  return out;
}
function lineHerrajes(line){
  const m=byId(line.modId); const ev=makeEval(m,line.vals); let P=0,C=0,E=0;
  m.pieces.forEach(p=>{ let q=0; try{q=ev.piece(p).Q}catch(e){}; const n=p.name.toLowerCase();
    if(p.role==='FRENTE'&&/^pue/.test(n))P+=q; if(p.role==='FRENTE'&&/^(fren|f-caj|frent)/.test(n))C+=q; if(/^est/.test(n))E+=q; });
  const ALTO=Number(line.vals.ALTO||0), ANCHO=Number(line.vals.ANCHO||0);
  return m.herrajes.map(h=>{ const f=h.formula.replace(/×/g,'*').replace(/PUERTAS/g,P).replace(/CAJONES/g,C).replace(/ESTANTES/g,E).replace(/ALTO/g,ALTO).replace(/ANCHO/g,ANCHO);
    let q=0; try{q=Function('return ('+f+')')()}catch(e){}; return {item:h.item,q} }).filter(h=>h.q>0);
}
/* piezas de una solicitud: calculadas desde el catálogo, o las editadas a mano (o.items) */
function orderPieces(o){
  if(o.items) return o.items;
  const out=[]; o.lines.forEach((l,i)=>linePieces(l,o.overrides).forEach(p=>out.push({...p,li:i}))); return out;
}
const CANTO_OPTS=[]; COLORES.forEach(c=>['0,45 mm','2 mm'].forEach(e=>CANTO_OPTS.push(c.n+' '+e)));
const PLACA_OPTS=[...COLORES.map(c=>c.n+' 18 mm'),FONDO.n];
const SIDE_LBL=['L1','L2','A1','A2'];
function totals(lines,overrides,pieces){
  const area={}; let canto={}; let piezas=0; const herr={};
  const ps = pieces || lines.flatMap(l=>linePieces(l,overrides));
  ps.forEach(p=>{ const L=Number(p.L)||0, A=Number(p.A)||0, Q=Number(p.Q)||0; piezas+=Q; area[p.mat]=(area[p.mat]||0)+L*A*Q/1e6;
    (p.cantos||[]).forEach(c=>{ if(!c.n) return; const mm=(c.sides[0]+c.sides[1])*L+(c.sides[2]+c.sides[3])*A; if(mm) canto[c.n]=(canto[c.n]||0)+mm*Q/1000; }); });
  lines.forEach(l=>lineHerrajes(l).forEach(h=>herr[h.item]=(herr[h.item]||0)+h.q));
  const placas=Object.entries(area).map(([mat,m2])=>({mat,m2,n:Math.ceil(m2/(PLACA_M2*APROV))}));
  const cantos=Object.entries(canto).map(([n,m])=>({n,m}));
  const costPlacas=placas.reduce((s,p)=>s+p.n*(p.mat===FONDO.n?PRECIO.fondo:PRECIO.placa),0);
  const costMO=placas.filter(p=>p.mat!==FONDO.n).reduce((s,p)=>s+p.n*PRECIO.manoPlaca,0);
  const costCanto=cantos.reduce((s,c)=>s+c.m*(/2 mm/.test(c.n)?PRECIO.canto2:PRECIO.canto045),0);
  const herrList=Object.entries(herr).map(([n,q])=>({n,q,p:hPrice(n)*q}));
  const costHerr=herrList.reduce((s,h)=>s+h.p,0);
  return {piezas,placas,cantos,herrList,costPlacas,costMO,costCanto,costHerr};
}

let pid=0;

function edGroups(){ const o=S.orders.find(x=>x.no===S.ed.no); const g=o.lines.map((l,i)=>({li:i,line:l,pieces:S.ed.items.filter(p=>p.li===i)})); g.push({li:null,line:null,pieces:S.ed.items.filter(p=>p.li==null)}); return {o,g}; }
function edDiff(){
  const orig=JSON.parse(S.ed.orig); const om={}; orig.forEach(r=>om[r[0]]=r);
  let mod=0,add=0; const ids=new Set();
  S.ed.items.forEach(p=>{ ids.add(p.id); const r=om[p.id]; const cur=[p.id,p.name,p.mat,Number(p.L),Number(p.A),Number(p.Q),!!p.rot,JSON.stringify(p.cantos.filter(c=>c.n&&c.sides.some(Boolean)))];
    if(!r) add++; else if(JSON.stringify([r[0],r[1],r[2],r[3],r[4],r[5],r[6],JSON.stringify(JSON.parse(r[7]||'[]').filter(c=>c.n&&c.sides.some(Boolean)))])!==JSON.stringify(cur)) mod++; });
  const del=orig.filter(r=>!ids.has(r[0])).length; return {mod,add,del};
}

            ${c.sides.map((s,k)=>`<td style="text-align:center"><input type="checkbox" class="ck2" id="ed_s_${p.id}_${ti}_${k}" data-edside="${p.id}" data-t="${ti}" data-k="${k}" ${s&&c.n?'checked':''} ${c.n?'':'disabled'} title="${c.n?['Largo 1','Largo 2','Ancho 1','Ancho 2'][k]:'Seleccione un canto'}" aria-label="${['Largo 1','Largo 2','Ancho 1','Ancho 2'][k]}"></td>`).join('')}</tr>` }).join('') }).join('')).join('')}</tbody></table></div></div>`; }
  if(e.step===3){ const d=edDiff(); const t=totals(o.lines,null,e.items.map(p=>({...p})));
    body=`<div class="two"><div class="card pad grid" style="gap:16px">
      <div><h3>Datos de contacto</h3><p style="margin:4px 0 0">${esc(e.cli.nombre)} - ${esc(e.cli.tel)}${e.cli.dir?' · '+esc(e.cli.dir):''}</p><p class="hint" style="margin:2px 0 0">Entrega comprometida: ${dmy(e.due)}${e.due!==o.due?` <b>(antes ${dmy(o.due)})</b>`:''}</p></div>
      <div><h3>Cortes solicitados</h3><p style="margin:4px 0 0">${e.items.length} piezas cargadas, ${e.items.reduce((s,p)=>s+Number(p.Q||0),0)} unidades en total, en ${o.lines.length} módulo${o.lines.length===1?'':'s'}.</p></div>
      <div><h3>Cambios respecto de la solicitud</h3><div class="row" style="margin-top:6px"><span class="chip due-done">${d.mod} modificada${d.mod===1?'':'s'}</span><span class="chip due-ok">${d.add} agregada${d.add===1?'':'s'}</span><span class="chip due-bad">${d.del} eliminada${d.del===1?'':'s'}</span></div></div>
      ${e.cli.obs?`<p class="hint" style="margin:0">${esc(e.cli.obs)}</p>`:''}
      <div class="infobox">Al guardar, el despiece de esta solicitud queda con estos cambios y se actualizan el Excel para la máquina y las hojas de taller. El catálogo de módulos no se modifica.</div>
    </div><aside class="sticky">${resumen(t,o.lines)}</aside></div>`; }
  return `<div><h1>Editar solicitud M-${o.no}</h1><p class="sub-t">Modificá los datos del cliente, las piezas y los cantos, y revisá el resumen antes de guardar.</p></div>
    ${e.err?`<div class="errbox">${esc(e.err)}</div>`:''}
    ${steps}${body}
    <div class="row"><button class="btn" data-edgo="cancel">Cancelar</button>${e.step>0?`<button class="btn" data-edgo="prev">${I.back}Volver</button>`:''}
    ${e.step<3?`<button class="btn pri" data-edgo="next">Siguiente</button>`:`<button class="btn pri" data-edgo="save">${I.save}Guardar cambios</button>`}</div>`;
}
function isChanged(p){ const orig=JSON.parse(S.ed.orig); const r=orig.find(x=>x[0]===p.id); if(!r) return true;
  return r[1]!==p.name||r[2]!==p.mat||r[3]!=p.L||r[4]!=p.A||r[5]!=p.Q||r[6]!==!!p.rot||JSON.stringify(JSON.parse(r[7]||'[]').filter(c=>c.n&&c.sides.some(Boolean)))!==JSON.stringify(p.cantos.filter(c=>c.n&&c.sides.some(Boolean))); }
function edValidate(){
  const e=S.ed;
  if(e.step===0 && (!e.cli.nombre.trim()||!e.cli.tel.trim())) return 'Completá el nombre del cliente y el teléfono de contacto.';
  if(e.step===1){ const bad=e.items.findIndex(p=>!(Number(p.L)>0&&Number(p.A)>0&&Number(p.Q)>0)); if(bad>=0) return `La pieza #${bad+1} tiene largo, ancho o cantidad vacíos o en cero.`; }
  return '';
}

/* ================= VISTA: editor de módulo ================= */

      <div class="grid" style="gap:10px"><b>Imagen</b><div class="line th" style="aspect-ratio:4/3;padding:0">${modThumb(m)}</div><button class="btn" data-act="img">Cambiar imagen</button>
      ${m.issues.length?`<div class="warnbox"><b>Revisar al importar del Excel</b><ul style="margin:6px 0 0;padding-left:18px">${m.issues.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:''}</div></div>`;

      ${m.params.map(p=>`<tr><td class="mono"><b>${p.key}</b></td><td>${esc(p.label)}</td><td>${p.formula?`<span class="mono">${esc(p.formula)}</span>`:`<input class="inp mono" type="number" style="max-width:120px" id="t_${p.key}" data-test="${p.key}" value="${S.test.vals[p.key]}"> mm`}</td><td>${p.formula?'<span class="tag o">Calculada</span>':'<span class="tag">Se pide al cargar</span>'}</td></tr>`).join('')}
      </tbody></table></div><div class="pad hint">Las medidas "Se pide al cargar" aparecen en la solicitud. Los códigos (ANCHO, ALTO…) se usan en las fórmulas.</div></div>`;
  if(S.editTab==='despiece') body=`<div class="card pad row" style="gap:14px;align-items:end">
      <b style="width:100%">Probar con medidas</b>${m.params.filter(p=>!p.formula).map(p=>`<label class="f" style="width:130px">${esc(p.label)}<input class="inp" type="number" id="t2_${p.key}" data-test="${p.key}" value="${S.test.vals[p.key]}"></label>`).join('')}
      <span class="hint">Los resultados se recalculan al instante.</span></div>
    <div class="card"><div class="tblwrap"><table><thead><tr><th>Pieza</th><th>Va en</th><th>Fórmula largo</th><th>Fórmula ancho</th><th>Cant.</th><th class="num">Resultado</th><th>Perfil A</th><th>Perfil B</th></tr></thead><tbody>
    ${m.pieces.map((p,i)=>{ let r,err=''; try{r=ev.piece(p)}catch(e){err=e.message}
      const tg=(arr,prof)=>`<span class="cx">${arr.map((s,k)=>`<button data-pc="${i}" data-prof="${prof}" data-k="${k}" class="${s?'on':''} ${s&&p.role==='FRENTE'&&prof==='A'?'t2':''}">${['L1','L2','A1','A2'][k]}</button>`).join('')}</span>`;
      return `<tr><td><b>${esc(p.name)}</b><div class="hint mono">${p.code}</div></td>
      <td><select class="inp" style="min-width:160px" id="r_${i}" data-role="${i}"><option value="ESQUELETO" ${p.role==='ESQUELETO'?'selected':''}>Esqueleto</option><option value="FRENTE" ${p.role==='FRENTE'?'selected':''}>Puertas y frentes</option><option value="FONDO" ${p.role==='FONDO'?'selected':''}>Fondo</option></select></td>
      <td><input class="inp mono ${err?'err':''}" style="min-width:170px" id="fl_${i}" data-fx="${i}" data-w="L" value="${esc(p.L)}"></td>
      <td><input class="inp mono ${err?'err':''}" style="min-width:170px" id="fa_${i}" data-fx="${i}" data-w="A" value="${esc(p.A)}"></td>
      <td><input class="inp mono" style="width:70px" id="fq_${i}" data-fx="${i}" data-w="Q" value="${esc(p.Q)}"></td>
      <td class="num mono">${err?`<span class="fx-err">${esc(err)}</span>`:`<span class="fx-ok">${Math.round(r.L)} × ${Math.round(r.A)}</span> <span class="hint">×${r.Q}</span>`}</td>
      <td>${tg(p.cA,'A')}</td><td>${tg(p.cB,'B')}</td></tr>`}).join('')}
    </tbody></table></div>
    <div class="pad row between"><p class="hint" style="margin:0;max-width:70ch">En las fórmulas se usan las medidas (ANCHO, ALTO, PROFUNDIDAD…) y otras piezas (por ejemplo <span class="mono">PISO.largo - 36</span>). Se admiten + − × / y paréntesis. Si una fórmula tiene un error, se marca en rojo y no se puede guardar.</p>
    <button class="btn" data-act="addpieza">${I.plus}Agregar pieza</button></div></div>`;
  if(S.editTab==='herrajes') body=`<div class="card"><div class="pad row between"><div><h3>Herrajes del módulo</h3><p class="hint" style="margin:4px 0 0">La cantidad puede ser fija o una fórmula (por ejemplo, 2 bisagras por puerta o 3 si la puerta mide más de 900 mm).</p></div><span class="tag opc">Opcional</span></div>
    <div class="tblwrap"><table><thead><tr><th>Herraje</th><th>Cantidad (fórmula)</th><th class="num">Con las medidas de prueba</th></tr></thead><tbody>
    ${m.herrajes.map(h=>{const q=(lineHerrajes({modId:m.id,vals:S.test.vals}).find(x=>x.item===h.item)||{q:0}).q; return `<tr><td><b>${esc(h.item)}</b></td><td class="mono">${esc(h.formula)}</td><td class="num"><b>${q}</b></td></tr>`}).join('')||'<tr><td colspan="3" class="empty">Sin herrajes</td></tr>'}
    </tbody></table></div><div class="pad"><button class="btn" data-act="addherraje">${I.plus}Agregar herraje</button></div></div>`;
  return `<div class="row between"><div class="row"><button class="btn ghost" data-nav="catalogo">${I.back}Catálogo</button><h1>${esc(m.name)}</h1></div>
    <button class="btn pri" data-act="guardarmod">Guardar cambios</button></div>
  <div class="tabs" role="tablist">${tabs.map(([k,l])=>`<button role="tab" class="${S.editTab===k?'on':''}" data-etab="${k}" aria-selected="${S.editTab===k}">${l}${k==='herrajes'?' <span class="tag opc">Opcional</span>':''}</button>`).join('')}</div>
  ${body}`;
}

/* ---------- render + eventos ---------- */
function render(){
  renderNav();
  const v=document.getElementById('view');
  const f=document.activeElement&&document.activeElement.id; const pos=f&&document.activeElement.selectionStart;
  v.innerHTML=({solicitudes:vSolicitudes,nueva:vNueva,detalle:vDetalle,editar:vEditar,catalogo:vCatalogo,editor:vEditor,herrajes:vHerrajes})[S.view]();
  if(f){ const el=document.getElementById(f); if(el){ el.focus(); try{ if(pos!=null) el.setSelectionRange(pos,pos) }catch(e){} } }
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-edstep],[data-edgo],[data-edadd],[data-eddup],[data-eddel],[data-edaddc],[data-edremc],[data-nav],[data-act],[data-step],[data-cat],[data-pick],[data-qty],[data-perf],[data-canto],[data-open],[data-dtab],[data-edit],[data-etab],[data-pc],[data-copy]');
  if(!t) return; const d=t.dataset; const w=S.wiz;
  if(t.matches('[data-edstep]')){ const s=Number(d.edstep); if(s<S.ed.step){S.ed.step=s;S.ed.err='';render();} return; }
  if(d.edgo){ const e=S.ed;
    if(d.edgo==='cancel'){ S.ed=null; return go('detalle'); }
    if(d.edgo==='prev'){ e.step--; e.err=''; return render(); }
    if(d.edgo==='next'){ e.err=edValidate(); if(!e.err) e.step++; render(); return window.scrollTo({top:0}); }
    if(d.edgo==='save'){ const o=S.orders.find(x=>x.no===e.no); const df=edDiff(); const chg=[];
      if(JSON.stringify(e.cli)!==JSON.stringify(o.cliente)) chg.push('datos del cliente');
      if(e.due!==o.due) chg.push(`entrega ${dmy(o.due)} → ${dmy(e.due)}`);
      const pl=(n,s)=>n+' '+(n===1?s:s.split(' ').map(w=>w+'s').join(' ')); if(df.mod) chg.push(pl(df.mod,'pieza modificada')); if(df.add) chg.push(pl(df.add,'pieza agregada')); if(df.del) chg.push(pl(df.del,'pieza eliminada'));
      e.items.forEach(p=>{ p.L=Number(p.L);p.A=Number(p.A);p.Q=Number(p.Q); p.chg = isChanged(p) ? (JSON.parse(e.orig).some(r=>r[0]===p.id)?'Editada':'Agregada') : (p.chg||''); p.cantos=p.cantos.filter(c=>c.n&&c.sides.some(Boolean)); });
      o.items=e.items; o.cliente={...e.cli}; o.due=e.due; o.hist.push({d:iso(TODAY),t:'Solicitud editada por Administrador'+(chg.length?': '+chg.join(', '):' (sin cambios)')});
      S.ed=null; toast('Cambios guardados'); return go('detalle',{detailTab:'despiece'}); }
  }
  if(d.edadd){ const li=d.edadd==='x'?null:Number(d.edadd); const o=S.orders.find(x=>x.no===S.ed.no);
    const mat=li==null?PLACA_OPTS[0]:col(o.lines[li].colE).n+' 18 mm';
    const np={id:'n'+(++pid),li,name:'',mat,L:'',A:'',Q:1,rot:false,cantos:[{n:'',sides:[0,0,0,0]}]};
    const lastIdx=S.ed.items.map(p=>p.li).lastIndexOf(li); if(lastIdx>=0) S.ed.items.splice(lastIdx+1,0,np); else S.ed.items.push(np);
    render(); const el=document.getElementById('ed_n_'+np.id); if(el) el.focus(); return; }
  if(d.eddup){ const i=S.ed.items.findIndex(p=>p.id===d.eddup); const c=JSON.parse(JSON.stringify(S.ed.items[i])); c.id='n'+(++pid); S.ed.items.splice(i+1,0,c); return render(); }
  if(d.eddel){ S.ed.items=S.ed.items.filter(p=>p.id!==d.eddel); return render(); }
  if(d.edaddc){ const p=S.ed.items.find(x=>x.id===d.edaddc); if(p.cantos.length<4) p.cantos.push({n:'',sides:[0,0,0,0]}); return render(); }
  if(d.edremc){ const p=S.ed.items.find(x=>x.id===d.edremc); if(p.cantos.length>1) p.cantos.pop(); return render(); }
  if(d.nav){ const n=[...NAV,...NAV_CFG].find(x=>x.k===d.nav); if(n&&n.off) return; S.catFilter='Todos'; S.q=''; return go(d.nav); }
  if(d.qty){ e.stopPropagation(); w.sel[d.qty]=Math.max(0,(w.sel[d.qty]||0)+Number(d.d)); return render(); }
  if(d.pick){ w.sel[d.pick]=w.sel[d.pick]?0:1; return render(); }
  if(d.cat){ S.catFilter=d.cat; return render(); }
  if(d.step!=null){ const s=Number(d.step); if(s<w.step){ w.step=s; render(); } return; }
  if(d.perf){ const l=w.lines.find(x=>x.uid===d.perf); l.perfil=Number(d.k); Object.keys(w.overrides).forEach(k=>{if(k.startsWith(l.uid))delete w.overrides[k]}); return render(); }
  if(d.copy){ const src=w.lines.find(x=>x.uid===d.copy); w.lines.filter(x=>x.modId===src.modId).forEach(x=>{x.vals={...src.vals};x.colE=src.colE;x.colF=src.colF;x.colC=src.colC;x.perfil=src.perfil}); toast('Medidas y colores copiados'); return render(); }
  if(d.canto){ const holder=S.view==='nueva'?w:S.orders.find(x=>x.no===S.detailId); const lines=holder.lines;
    const [uid]=d.canto.split('|'); const l=lines.find(x=>x.uid===uid); const p=linePieces(l,holder.overrides).find(x=>x.key===d.canto);
    const s=p.sides.slice(); s[Number(d.i)]=s[Number(d.i)]?0:1; holder.overrides[d.canto]=s; return render(); }
  if(d.open){ return go('detalle',{detailId:Number(d.open),detailTab:'despiece'}); }
  if(d.dtab){ S.detailTab=d.dtab; return render(); }
  if(d.edit){ return go('editor',{editId:d.edit,editTab:'despiece'}); }
  if(d.etab){ S.editTab=d.etab; return render(); }
  if(d.pc!=null){ const p=byId(S.editId).pieces[Number(d.pc)]; const arr=d.prof==='A'?p.cA:p.cB; arr[Number(d.k)]=arr[Number(d.k)]?0:1; return render(); }
  switch(d.act){
    case 'nueva': S.wiz=newWiz(); S.catFilter='Todos'; S.q=''; return go('nueva');
    case 'next': if(w.step===1) syncLines(); w.step++; window.scrollTo({top:0}); return render();
    case 'prev': w.step--; return render();
    case 'applydef': w.lines.forEach(l=>{l.colE=w.defE;l.colF=w.defF;l.colC=w.defC}); toast('Colores aplicados a todos los módulos'); return render();
    case 'crear': { const no=Math.max(...S.orders.map(o=>o.no))+1;
      S.orders.push({no,cliente:{...w.cliente},created:iso(TODAY),due:w.cliente.due,estado:'PENDIENTE',lines:w.lines,overrides:w.overrides,hist:[{d:iso(TODAY),t:'Solicitud creada por Administrador'}]});
      toast(`Solicitud M-${no} creada`); return go('detalle',{detailId:no,detailTab:'despiece'}); }
    case 'avanzar': { const o=S.orders.find(x=>x.no===S.detailId); const i=ESTADOS.indexOf(o.estado); o.hist.push({d:iso(TODAY),t:`Estado: ${EST_LBL[o.estado]} → ${EST_LBL[ESTADOS[i+1]]}`}); o.estado=ESTADOS[i+1]; toast('Estado actualizado: '+EST_LBL[o.estado]); return render(); }
    case 'editar': return startEdit(S.orders.find(x=>x.no===S.detailId));
    case 'xls': return toast('En el sistema se descarga el .xlsx listo para la máquina');
    case 'imprimir': return toast('En el sistema abre la impresión: una hoja por módulo');
    case 'guardarmod': return toast('Módulo guardado');
    case 'nuevomod': return toast('Abre un módulo vacío para cargar medidas y piezas');
    case 'img': return toast('Permite subir una foto o render del módulo');
    case 'addpieza': return toast('Agrega una fila nueva al despiece');
    case 'addherraje': return toast('Agrega un herraje con su cantidad o fórmula');
  }
});
document.addEventListener('keydown',e=>{ if((e.key==='Enter'||e.key===' ')&&e.target.matches('tr[data-open],[data-edit],[data-step],[data-edstep]')){ e.preventDefault(); e.target.click(); } });
document.addEventListener('input',e=>{
  const t=e.target, d=t.dataset, w=S.wiz;
  if(d.edcli){ S.ed.cli[d.edcli]=t.value; return; }
  if(d.edf){ const p=S.ed.items.find(x=>x.id===d.id); p[d.edf]= t.value; if(d.edf!=='name') return render(); return; }
  if(t.id==='q'){ S.q=t.value; return render(); }
  if(d.cli){ w.cliente[d.cli]=t.value; if(d.cli==='nombre'){ const b=document.querySelector('[data-act="next"]'); if(b) b.disabled=t.value.trim().length<2; } return; }
  if(d.line){ const l=w.lines.find(x=>x.uid===d.line); l.vals[d.k]=t.value===''?0:Number(t.value); return render(); }
  if(d.test){ S.test.vals[d.test]=Number(t.value)||0; return render(); }
  if(d.fx!=null){ const p=byId(S.editId).pieces[Number(d.fx)]; p[d.w]=t.value; return render(); }
});
document.addEventListener('change',e=>{
  const t=e.target, d=t.dataset, w=S.wiz;
  if(d.eddue){ S.ed.due=t.value; return; }
  if(d.edrot){ S.ed.items.find(x=>x.id===d.edrot).rot=t.checked; return render(); }
  if(d.edrotall){ S.ed.items.forEach(p=>p.rot=t.checked); return render(); }
  if(d.edct){ const p=S.ed.items.find(x=>x.id===d.edct); p.cantos[Number(d.t)].n=t.value; return render(); }
  if(d.edall){ const p=S.ed.items.find(x=>x.id===d.edall); const ti=Number(d.t); p.cantos[ti].sides=[0,1,2,3].map(()=>t.checked?1:0); if(t.checked) p.cantos.forEach((c,j)=>{ if(j!==ti) c.sides=[0,0,0,0]; }); return render(); }
  if(d.edside){ const p=S.ed.items.find(x=>x.id===d.edside); const ti=Number(d.t), k=Number(d.k); p.cantos[ti].sides[k]=t.checked?1:0; if(t.checked) p.cantos.forEach((c,j)=>{ if(j!==ti) c.sides[k]=0; }); return render(); }
  if(d.def){ w[d.def]=t.value; return; }
  if(d.lc){ const l=w.lines.find(x=>x.uid===d.lc); l[d.f]=t.value; return render(); }
  if(d.due){ const o=S.orders.find(x=>x.no===Number(d.due)); o.hist.push({d:iso(TODAY),t:`Fecha de entrega: ${dmy(o.due)} → ${dmy(t.value)}`}); o.due=t.value; toast('Fecha de entrega actualizada'); return render(); }
  if(d.role!=null){ byId(S.editId).pieces[Number(d.role)].role=t.value; return render(); }
  if(d.mf){ const m=byId(S.editId); m[d.mf]= d.mf==='active'? t.value==='1' : t.value; return render(); }
});
render();
</script>
</body></html>
